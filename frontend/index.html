<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#141110" />
    <script>
      // Before the first paint: the dark theme is the default, a saved "light" switches it (see src/theme/theme.ts).
      try {
        if (localStorage.getItem('checkist.theme') === 'light') {
          document.documentElement.setAttribute('data-theme', 'light')
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f6efdc')
        }
      } catch (error) {}
    </script>
    <meta name="description" content="Чекист — учёт покупок по фото чеков: распознавание, каталог товаров, цены в магазинах и статистика трат." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Installable app: «На экран Домой» on iPhone, «Установить приложение» on Android. The service worker
         (public/sw.js, registered in src/offline/service-worker.ts) opens the app without network; navigations go to
         the network first, so a deploy is shown on the next online open. -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Чекист" />
    <!-- "default": the page starts below the status bar; the header has no top safe-area padding. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Чекист</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
