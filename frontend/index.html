<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0e1316" />
    <script>
      // Before the first paint (see src/theme/theme.ts): a saved choice wins; without one the theme of the system.
      // The dark theme is the default of the stylesheet; only the light one needs the attribute.
      ;(function () {
        var saved = null
        try {
          saved = localStorage.getItem('checkist.theme')
        } catch (error) {}
        try {
          if (saved === 'light' || (saved !== 'dark' && window.matchMedia('(prefers-color-scheme: light)').matches)) {
            document.documentElement.setAttribute('data-theme', 'light')
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f3f5f7')
          }
        } catch (error) {}
      })()
    </script>
    <meta name="description" content="Чекист — семейный бюджет по фото чеков и тратам словами: распознавание, лимиты по категориям, цены в магазинах и статистика трат." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Installable app: «На экран Домой» on iPhone, «Установить приложение» on Android. No service worker:
         the app needs the network anyway, and a cache would keep an old version after a deploy. -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Чекист" />
    <!-- "default": the page starts below the status bar; the header has no top safe-area padding. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Manrope (OFL 1.1) from Google Fonts: no Content-Security-Policy forbids it (deploy/Caddyfile, deploy/docker/Caddyfile);
         display=swap shows system-ui until the font arrives. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&amp;display=swap" />
    <title>Чекист</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
