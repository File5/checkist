
  # Checkist (checkist.suslicketeam.com) — generated by deploy/grafana/build_dashboards.py of the
  # Checkist repository. Appended to provisioning/dashboards/dashboards.yml (docs/observability.md).
  - name: checkist
    orgId: 1
    folder: Checkist
    type: file
    disableDeletion: false
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards-checkist
      foldersFromFilesStructure: false
