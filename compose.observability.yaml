# Override of compose.prod.yaml for a server with Prometheus and Grafana (docs/observability.md).
# deploy/docker/ck adds it when the environment file sets CHECKIST_OBSERVABILITY=1. Two networks of
# two members each, created on the server beforehand (`docker network create --internal`), never the
# shared monitoring network:
#   checkist-metrics    — web and observ-prometheus: Prometheus scrapes checkist-web:8000/metrics;
#   checkist-grafana-db — postgres and suslicketeam-grafana: Grafana reads checkist-pg:5432 as the
#                         read-only role of `manage.py grafana_reader`.
# Without the variable nothing changes: a QA machine has no such networks.
services:
  web:
    networks:
      default:
      checkist-metrics:
        aliases: [checkist-web]
    environment:
      # Commit of the checkout for checkist_build_info; ck exports it.
      CHECKIST_COMMIT: ${CHECKIST_COMMIT:-}
  postgres:
    networks:
      default:
      checkist-grafana-db:
        aliases: [checkist-pg]

networks:
  checkist-metrics:
    external: true
  checkist-grafana-db:
    external: true
