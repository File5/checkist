services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-checkist_dev}
      POSTGRES_USER: ${POSTGRES_USER:-checkist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-checkist_dev_only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
  redis:
    image: redis:7.4.11-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
  worker:
    build: ./backend
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-checkist_dev}
      POSTGRES_USER: ${POSTGRES_USER:-checkist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-checkist_dev_only}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      DJANGO_CACHE_URL: redis://redis:6379/2
    volumes:
      - ./backend:/app:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO", "--pool=prefork", "--concurrency=2", "--hostname=checkist@worker"]
    healthcheck:
      test: ["CMD", "celery", "-A", "config", "inspect", "ping", "--destination=checkist@worker", "--timeout=2"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
volumes:
  postgres_data:
  redis_data:
